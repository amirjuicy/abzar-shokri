<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسویه حساب | ابزار شکری</title>
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-header" class="mobile-header"></div>
  <main>
    <div class="breadcrumb"><div class="container"><div class="breadcrumb-list">
      <span class="breadcrumb-item"><a href="index.html">خانه</a></span>
      <span class="breadcrumb-sep">‹</span>
      <span class="breadcrumb-item"><a href="cart.html">سبد خرید</a></span>
      <span class="breadcrumb-sep">‹</span>
      <span class="breadcrumb-item breadcrumb-item--active">تسویه حساب</span>
    </div></div></div>
    <div class="container">
      <h1 class="page-header__title" style="padding:var(--space-4) 0 var(--space-2)">تسویه حساب</h1>
      <form class="checkout-layout" id="checkout-form">
        <div>
          <!-- Customer Info -->
          <div class="checkout-section">
            <h2 class="checkout-section__title"><span class="checkout-section__number">۱</span> اطلاعات مشتری</h2>
            <div class="form-row"><div class="form-group"><label class="input-label">نام *</label><input class="input" required placeholder="نام"></div><div class="form-group"><label class="input-label">نام خانوادگی *</label><input class="input" required placeholder="نام خانوادگی"></div></div>
            <div class="form-row" style="margin-top:var(--space-4)"><div class="form-group"><label class="input-label">موبایل *</label><input class="input" dir="ltr" required placeholder="09XXXXXXXXX"></div><div class="form-group"><label class="input-label">ایمیل</label><input class="input" dir="ltr" placeholder="email@example.com"></div></div>
          </div>
          <!-- Shipping Address -->
          <div class="checkout-section">
            <h2 class="checkout-section__title"><span class="checkout-section__number">۲</span> آدرس ارسال</h2>
            <div class="form-row"><div class="form-group"><label class="input-label">استان *</label><select class="input" id="province-select" required></select></div><div class="form-group"><label class="input-label">شهر *</label><select class="input" id="city-select" required></select></div></div>
            <div class="form-group full-width" style="margin-top:var(--space-4)"><label class="input-label">آدرس کامل *</label><textarea class="input" rows="3" required placeholder="آدرس کامل پستی..." style="resize:vertical"></textarea></div>
            <div class="form-row" style="margin-top:var(--space-4)"><div class="form-group"><label class="input-label">کد پستی *</label><input class="input" dir="ltr" required placeholder="XXXXXXXXXX"></div><div class="form-group"><label class="input-label">نام تحویل‌گیرنده</label><input class="input" placeholder="نام تحویل‌گیرنده"></div></div>
            <div class="form-group" style="margin-top:var(--space-4)"><label class="input-label">شماره تماس تحویل‌گیرنده</label><input class="input" dir="ltr" placeholder="09XXXXXXXXX"></div>
          </div>
          <!-- Shipping Method -->
          <div class="checkout-section">
            <h2 class="checkout-section__title"><span class="checkout-section__number">۳</span> روش ارسال</h2>
            <label class="shipping-option is-active"><input type="radio" name="shipping" value="normal" checked><div><div style="font-weight:var(--font-weight-semibold)">ارسال عادی</div><div style="font-size:var(--font-size-xs);color:var(--text-muted)">تحویل ۳ تا ۵ روز کاری</div></div><span style="margin-right:auto;font-weight:var(--font-weight-semibold);color:var(--color-success)">رایگان</span></label>
            <label class="shipping-option"><input type="radio" name="shipping" value="express"><div><div style="font-weight:var(--font-weight-semibold)">ارسال سریع</div><div style="font-size:var(--font-size-xs);color:var(--text-muted)">تحویل ۱ تا ۲ روز کاری</div></div><span style="margin-right:auto;font-weight:var(--font-weight-semibold)">۳۵,۰۰۰ تومان</span></label>
          </div>
          <!-- Payment Method -->
          <div class="checkout-section">
            <h2 class="checkout-section__title"><span class="checkout-section__number">۴</span> روش پرداخت</h2>
            <label class="payment-option is-active"><input type="radio" name="payment" value="online" checked><div><div style="font-weight:var(--font-weight-semibold)">پرداخت آنلاین</div><div style="font-size:var(--font-size-xs);color:var(--text-muted)">پرداخت از طریق درگاه بانکی</div></div></label>
            <label class="payment-option"><input type="radio" name="payment" value="cod"><div><div style="font-weight:var(--font-weight-semibold)">پرداخت در محل (网络不可用)</div><div style="font-size:var(--font-size-xs);color:var(--text-muted)">پرداخت نقدی هنگام تحویل</div></div></label>
          </div>
          <button type="submit" class="btn btn-accent btn-lg btn-block" style="font-size:var(--font-size-md);padding:var(--space-4)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            پرداخت و ثبت سفارش
          </button>
        </div>
        <div>
          <div class="cart-summary-box">
            <h3 class="cart-summary-box__title">خلاصه سفارش</h3>
            <div id="checkout-summary-items"></div>
            <div id="checkout-summary-total" style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border-color-light)"></div>
          </div>
        </div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <div id="site-overlays"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
