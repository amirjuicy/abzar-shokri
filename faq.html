<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوالات متداول | ابزار شکری</title>
<link rel="stylesheet" href="assets/css/design-system.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/header.css"><link rel="stylesheet" href="assets/css/footer.css"><link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<header id="site-header"></header>
<div id="mobile-header" class="mobile-header"></div>
<main>
<div class="breadcrumb"><div class="container"><div class="breadcrumb-list"><span class="breadcrumb-item"><a href="index.html">خانه</a></span><span class="breadcrumb-sep">‹</span><span class="breadcrumb-item breadcrumb-item--active">سوالات متداول</span></div></div></div>
<div class="static-page"><div class="container">
<h1 class="static-page__title">سوالات متداول</h1>
<div id="faq-container"></div>
</div></div>
</main>
<footer id="site-footer"></footer>
<div id="site-overlays"></div>
<script src="assets/js/data.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/common.js"></script>
<script>
(function(){
var container=document.getElementById("faq-container");
if(!container)return;
var activeCat="";
function render(){
var cats="<div class=\"faq-categories\"><button class=\"faq-cat-btn is-active\" onclick=\"filterFaq('')\">همه</button>"+AppData.faqCategories.map(function(c){return "<button class=\"faq-cat-btn\" onclick=\"filterFaq('"+c.id+"')\">"+c.name+"</button>";}).join("")+"</div>";
var items=activeCat?AppData.faqItems.filter(function(f){return f.category===activeCat;}):AppData.faqItems;
var html=items.map(function(f){
return "<div class=\"faq-item\"><div class=\"faq-item__question\" onclick=\"this.parentElement.classList.toggle('is-open')\">"+f.question+"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9 12 15 18 9\"/></svg></div><div class=\"faq-item__answer\">"+f.answer+"</div></div>";
}).join("");
container.innerHTML=cats+html;
}
window.filterFaq=function(cat){
activeCat=cat;
container.querySelectorAll(".faq-cat-btn").forEach(function(b){b.classList.remove("is-active");});
event.target.classList.add("is-active");
render();
};
render();
})();
</script>
</body></html>
