<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقاله | ابزار شکری</title>
<link rel="stylesheet" href="assets/css/design-system.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/header.css"><link rel="stylesheet" href="assets/css/footer.css"><link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<header id="site-header"></header>
<div id="mobile-header" class="mobile-header"></div>
<main id="article-content"></main>
<footer id="site-footer"></footer>
<div id="site-overlays"></div>
<script src="assets/js/data.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/common.js"></script>
<script>
(function(){
var el=document.getElementById('article-content');
if(!el)return;
var params=new URLSearchParams(window.location.search);
var id=parseInt(params.get('id'))||1;
var article=AppData.articles.find(function(a){return a.id===id;})||AppData.articles[0];
document.title=article.title+' | ابزار شکری';
el.innerHTML='<div class="breadcrumb"><div class="container"><div class="breadcrumb-list"><span class="breadcrumb-item"><a href="index.html">خانه</a></span><span class="breadcrumb-sep">‹</span><span class="breadcrumb-item"><a href="articles.html">مقالات</a></span><span class="breadcrumb-sep">‹</span><span class="breadcrumb-item breadcrumb-item--active">'+article.title+'</span></div></div></div><article class="article-detail"><span class="article-detail__category">'+article.category+'</span><h1 class="article-detail__title">'+article.title+'</h1><div class="article-detail__meta"><span>'+article.author+'</span><span>'+article.date+'</span><span>'+article.readTime+' مطالعه</span></div><div style="background:var(--color-gray-100);border-radius:var(--radius-lg);height:300px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);margin-bottom:var(--space-6)"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="article-detail__content">'+article.content+'</div><div class="article-detail__share"><span style="font-size:var(--font-size-sm);color:var(--text-muted)">اشتراک‌گذاری:</span><button class="btn btn-ghost btn-sm" onclick="App.showToast(\'کپی لینک (شبیه‌سازی)\',\'info\')">کپی لینک</button></div></article><div class="related-products"><div class="container"><div class="section-header"><h2 class="section-title">مقالات مرتبط</h2></div><div class="articles-grid" id="related-articles"></div></div></div>';
var related=document.getElementById('related-articles');
if(related){related.innerHTML=AppData.articles.filter(function(a){return a.id!==article.id&&a.categorySlug===article.categorySlug;}).slice(0,3).concat(AppData.articles.filter(function(a){return a.id!==article.id&&a.categorySlug!==article.categorySlug;}).slice(0,3)).slice(0,3).map(function(a){return '<div class="article-card" onclick="window.location.href=\'article-detail.html?id='+a.id+'\'" style="cursor:pointer"><div class="article-card__image"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted)"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg></div><span class="article-card__category">'+a.category+'</span></div><div class="article-card__body"><h3 class="article-card__title">'+a.title+'</h3><div class="article-card__meta"><span class="article-card__meta-item">'+a.date+'</span></div></div></div>';}).join('');}
})();
</script>
</body></html>
