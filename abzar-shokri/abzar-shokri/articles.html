<body>
<header id="site-header"></header>

<main>
<div class="breadcrumb"><div class="container"><div class="breadcrumb-list"><span class="breadcrumb-item"><a href="/">خانه</a></span><span class="breadcrumb-sep">›</span><span class="breadcrumb-item breadcrumb-item--active">مقالات</span></div></div></div>
<div class="blog-page">
<div class="container">
<div class="blog-masthead">
<div class="blog-header">
  <div class="blog-header__right">
    <div class="blog-header__eyebrow">مجله <span data-setting="store.name">ابزار شکری</span> — Journal</div>
    <h1 class="blog-header__title">مقالات و راهنماها</h1>
    <p class="blog-header__desc">راهنمای خرید، آموزش و مقایسه تخصصی ابزار — کوتاه، کاربردی و قابل اعتماد. منتخب سردبیر و تازه‌ترین مطالب هفته.</p>
  </div>
  <div class="blog-header__meta"><span class="blog-header__count" id="blog-count"></span><span class="blog-header__sub">به‌روزرسانی هفتگی</span></div>
</div>
</div>
<div class="blog-filters" id="article-cat-filter"></div>
<div id="blog-featured"></div>
<div class="blog-grid" id="articles-grid"></div>
</div>

<script src="assets/js/data.js"></script><script src="assets/js/icons.js"></script><script src="assets/js/common.js"></script>
  <script src="assets/js/pwa.js"></script>
<script>
(function(){
var catFilter=document.getElementById('article-cat-filter');
var grid=document.getElementById('articles-grid');
var featured=document.getElementById('blog-featured');
var countEl=document.getElementById('blog-count');
var activeCat='';
function imgOf(a){ return a.image||a.featuredImage||''; }
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function faDate(ts){ try{ if(!ts) return ''; var d=new Date(String(ts).trim().replace(' ','T')); if(isNaN(d.getTime())) return ''; return d.toLocaleDateString('fa-IR'); }catch(e){ return ''; } }
function cardHtml(a){
  var img=imgOf(a);
  var media=img?'<img src="'+escH(img)+'" alt="'+escH(a.title||'')+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'"><span class="blog-card__cat">'+a.category+'</span>':'<div class="blog-card__media-placeholder"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3"/><path d="M21 15l-5-5-10 10"/></svg></div><span class="blog-card__cat">'+a.category+'</span>';
  return '<article class="blog-card" onclick="window.location.href=\'/article/'+a.id+'\'"><div class="blog-card__media">'+media+'</div><div class="blog-card__body"><h3 class="blog-card__title">'+a.title+'</h3><p class="blog-card__excerpt">'+a.excerpt+'</p><div class="blog-card__meta"><span>'+a.date+'</span><span class="sep"></span><span>'+a.readTime+'</span><span class="sep"></span><span>'+a.author+'</span></div></div></article>';
}
function featuredHtml(a){
  if(!a) return '';
  var img=imgOf(a);
  var media=img?'<img src="'+escH(img)+'" alt="'+escH(a.title||'')+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">':'<div class="blog-featured__media-placeholder"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3"/><path d="M21 15l-5-5-10 10"/></svg></div>';
  return '<div class="blog-featured" onclick="window.location.href=\'/article/'+a.id+'\'"><div class="blog-featured__media"><span class="blog-featured__img-badge"><i></i> مقاله منتخب</span>'+media+'</div><div class="blog-featured__body"><div class="blog-featured__cat">'+a.category+'</div><h2 class="blog-featured__title">'+a.title+'</h2><p class="blog-featured__excerpt">'+a.excerpt+'</p><div class="blog-featured__meta"><span>'+a.author+'</span><span class="dot"></span><span>'+a.date+'</span><span class="dot"></span><span>'+a.readTime+'</span></div><span class="blog-featured__cta">مطالعه مقاله</span></div></div>';
}
function allArticles(){ return window.__apiArticles || AppData.articles; }
function render(){
var articles=activeCat?allArticles().filter(function(a){return a.categorySlug===activeCat;}):allArticles();
if(countEl) countEl.textContent=articles.length+' مقاله';
var feat = !activeCat && articles.length ? articles[0] : null;
var rest = feat ? articles.slice(1) : articles;
if(featured) featured.innerHTML= feat ? featuredHtml(feat) : '';
if(grid) grid.innerHTML=rest.map(cardHtml).join('') || '<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--text-muted);font-size:13px;border:1px solid var(--border-color-light);border-radius:var(--radius-lg)">مقاله‌ای یافت نشد.</div>';
}
if(catFilter){
catFilter.innerHTML='<button class="blog-filter is-active" onclick="filterArticles(\'\')">همه</button>'+AppData.articleCategories.map(function(c){return '<button class="blog-filter" onclick="filterArticles(\''+c.slug+'\')">'+c.name+'</button>';}).join('');
}
window.filterArticles=function(slug){
  activeCat=slug;
  if(catFilter){
    catFilter.querySelectorAll('.blog-filter').forEach(function(b){
      var onclick=b.getAttribute('onclick')||'';
      var isAll= slug==='' && b.textContent.trim()==='همه';
      var isMatch= slug!=='' && onclick.includes("'"+slug+"'");
      b.classList.toggle('is-active', isAll || isMatch);
    });
  }
  render();
};
render();
fetch('/api/articles?limit=100').then(function(r){return r.json();}).then(function(d){
  var items=(d&&(d.items||d))||[]; if(!Array.isArray(items)||!items.length) return;
  var base=AppData.articles.slice();
  function norm(a){ return { id:a.id, slug:a.slug, title:a.title, excerpt:a.excerpt||'', content:a.content||'', image:a.image||a.featuredImage||'', featuredImage:a.image||a.featuredImage||'', category:'مقالات', categorySlug:'', date:faDate(a.createdAt||a.created_at), createdAt:a.createdAt||a.created_at||'', readTime:'', author:'' }; }
  var bySlug={}; base.forEach(function(a){ if(a.slug) bySlug[a.slug]=a; });
  var merged=base.slice();
  items.forEach(function(it){
    var n=norm(it); var ex=bySlug[it.slug];
    if(ex){ ex.image=n.image; ex.featuredImage=n.image; ex.title=it.title||ex.title; ex.excerpt=it.excerpt||ex.excerpt; if(it.content) ex.content=it.content; var _d=faDate(it.createdAt||it.created_at); if(_d){ ex.date=_d; ex.createdAt=it.createdAt||it.created_at; } }
    else merged.unshift(n);
  });
  window.__apiArticles=merged; render();
}).catch(function(){});
})();
</script>
