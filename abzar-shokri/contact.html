<div class="contact-info-item"><div class="contact-info-item__icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><div class="contact-info-item__label">ساعت کاری</div><div class="contact-info-item__value">شنبه تا پنج‌شنبه، ۹ صبح تا ۶ عصر</div></div></div>

<div class="contact-form">

</div>
